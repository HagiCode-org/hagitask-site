name: HagiTask Site Deploy gh-pages

on:
  push:
    branches:
      - main
    # The sync workflow commits only `community-packages.commit`; ignore that
    # state-only push so recording a successful publish does not recurse into
    # another deployment.
    paths-ignore:
      - community-packages.commit
  workflow_dispatch:
    inputs:
      community_commit:
        description: >
          Exact Community (hagitask-community-packages) commit to build and publish.
          When omitted, the deploy reads the recorded commit from community-packages.commit.
        required: false
        type: string

concurrency:
  group: hagitask-site-deploy-gh-pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22.12.0"
  NODE_ENV: production
  HAGITASK_GH_PAGES_PAYLOAD_DIR: .deploy/gh-pages
  COMMUNITY_REPO: "https://github.com/HagiCode-org/hagitask-community-packages.git"

jobs:
  build:
    name: Prepare validated publication payload
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout current source ref
        uses: actions/checkout@v4

      - name: Resolve Community commit
        id: community
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.community_commit }}" ]; then
            requested="${{ inputs.community_commit }}"
            origin="workflow input (community_commit)"
          else
            if [ ! -f community-packages.commit ]; then
              echo "::error::community-packages.commit is missing. Provide community_commit input or commit the state file."
              exit 1
            fi
            requested="$(tr -d '[:space:]' < community-packages.commit)"
            origin="community-packages.commit state file"
          fi
          if ! printf '%s' "${requested}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Resolved Community commit is not a valid 40-character lowercase SHA: ${requested}"
            exit 1
          fi
          echo "requested=${requested}" >> "$GITHUB_OUTPUT"
          echo "origin=${origin}" >> "$GITHUB_OUTPUT"

      - name: Checkout Community content at exact commit
        id: community-checkout
        env:
          COMMUNITY_REPO: ${{ env.COMMUNITY_REPO }}
        run: |
          set -euo pipefail
          source_dir="${RUNNER_TEMP}/hagitask-community-source"
          rm -rf "${source_dir}"
          # Shallow checkout of the exact commit keeps the build input immutable
          # and avoids downloading full Community history.
          git clone --filter=blob:none --no-checkout "${COMMUNITY_REPO}" "${source_dir}"
          git -C "${source_dir}" fetch --depth 1 origin "${{ steps.community.outputs.requested }}"
          git -C "${source_dir}" checkout "${{ steps.community.outputs.requested }}"
          resolved="$(git -C "${source_dir}" rev-parse HEAD)"
          echo "source-dir=${source_dir}" >> "$GITHUB_OUTPUT"
          echo "resolved=${resolved}" >> "$GITHUB_OUTPUT"
          {
            echo "## Community build source"
            echo "- Repository: ${COMMUNITY_REPO}"
            echo "- Ref origin: ${{ steps.community.outputs.origin }}"
            echo "- Requested commit: ${{ steps.community.outputs.requested }}"
            echo "- Resolved commit: ${resolved}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build and verify site
        # Community task data and authoritative schemas are read from the
        # dynamic checkout pointed at by HAGITASK_COMMUNITY_SOURCE_DIR.
        env:
          HAGITASK_COMMUNITY_SOURCE_DIR: ${{ steps.community-checkout.outputs.source-dir }}
        run: npm run build

      - name: Stage HagiTask schemas into publication payload
        env:
          HAGITASK_COMMUNITY_SOURCE_DIR: ${{ steps.community-checkout.outputs.source-dir }}
        run: npm run stage:schemas

      - name: Verify publication payload
        run: npm run verify

      - name: Assemble gh-pages publication payload
        run: |
          rm -rf "${HAGITASK_GH_PAGES_PAYLOAD_DIR}"
          mkdir -p "${HAGITASK_GH_PAGES_PAYLOAD_DIR}/dist"
          cp .github/gh-pages/esa.jsonc "${HAGITASK_GH_PAGES_PAYLOAD_DIR}/esa.jsonc"
          cp .github/gh-pages/wrangler.jsonc "${HAGITASK_GH_PAGES_PAYLOAD_DIR}/wrangler.jsonc"
          cp -R dist/. "${HAGITASK_GH_PAGES_PAYLOAD_DIR}/dist/"

      - name: Upload validated gh-pages payload
        uses: actions/upload-artifact@v4
        with:
          name: hagitask-site-gh-pages-payload
          path: ${{ env.HAGITASK_GH_PAGES_PAYLOAD_DIR }}
          if-no-files-found: error

  deploy:
    name: Publish validated snapshot to gh-pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    environment:
      name: hagitask-production
      url: https://tasks.hagicode.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download validated gh-pages payload
        uses: actions/download-artifact@v4
        with:
          name: hagitask-site-gh-pages-payload
          path: .deploy/gh-pages

      - name: Publish validated gh-pages payload
        id: publish-gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./.deploy/gh-pages
          force_orphan: true
          enable_jekyll: false

      - name: Summarize deployment output
        if: always()
        env:
          PUBLISH_OUTCOME: ${{ steps.publish-gh-pages.outcome }}
        run: |
          echo "## Publication status" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publication source: validated build artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`gh-pages\` publication: ${PUBLISH_OUTCOME}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Published payload: branch-root \`esa.jsonc\`, \`wrangler.jsonc\`, plus \`dist/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub environment: hagitask-production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Expected public URL: https://tasks.hagicode.com" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            echo "Published the validated gh-pages payload with ./esa.jsonc, ./wrangler.jsonc, and ./dist/."
          else
            echo "Validated gh-pages publication did not complete successfully."
          fi