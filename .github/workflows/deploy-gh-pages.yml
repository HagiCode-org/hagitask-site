name: HagiTask Site Deploy gh-pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hagitask-site-deploy-gh-pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22.12.0"
  NODE_ENV: production
  HAGITASK_GH_PAGES_PAYLOAD_DIR: .deploy/gh-pages
  HAGITASK_SCHEMA_SOURCE_REPO: https://github.com/HagiCode-org/hagitask.git
  HAGITASK_SCHEMA_SOURCE_FALLBACK_REF: main

jobs:
  build:
    name: Prepare validated publication payload
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout current source ref
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Initialize community-packages and nested submodules
        # Also picks up the pointer advanced by the "Sync Community Content" workflow,
        # so a sync push to Site main is rebuilt here against the updated Community commit.
        # `recursive` pulls the nested `hagitask` submodule so the authoritative schemas
        # are present for the build and verification steps.
        run: git submodule update --init --recursive

      - name: Build and verify site
        run: npm run build

      - name: Download HagiTask schema source
        id: schema-source
        # Standalone download into a runner temp directory: HagiTask is deliberately not
        # registered as a Site submodule. The ref is pinned to the HagiTask commit that
        # community-packages already records, so the published schemas match the revision
        # the build and the Community validator were checked against.
        run: |
          set -euo pipefail
          source_dir="${RUNNER_TEMP}/hagitask-schema-source"
          rm -rf "${source_dir}"
          pinned_commit="$(git -C community-packages rev-parse 'HEAD:hagitask' 2>/dev/null || true)"
          if [ -n "${pinned_commit}" ]; then
            requested_ref="${pinned_commit}"
            ref_origin="community-packages gitlink"
          else
            requested_ref="${HAGITASK_SCHEMA_SOURCE_FALLBACK_REF}"
            ref_origin="workflow fallback ref"
          fi
          git init --quiet "${source_dir}"
          git -C "${source_dir}" remote add origin "${HAGITASK_SCHEMA_SOURCE_REPO}"
          git -C "${source_dir}" fetch --quiet --depth 1 origin "${requested_ref}"
          git -C "${source_dir}" checkout --quiet FETCH_HEAD
          resolved_commit="$(git -C "${source_dir}" rev-parse HEAD)"
          echo "source-dir=${source_dir}" >> "$GITHUB_OUTPUT"
          echo "commit=${resolved_commit}" >> "$GITHUB_OUTPUT"
          {
            echo "## Published schema source"
            echo "- Repository: ${HAGITASK_SCHEMA_SOURCE_REPO}"
            echo "- Ref origin: ${ref_origin}"
            echo "- Commit: ${resolved_commit}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage HagiTask schemas into publication payload
        env:
          HAGITASK_SCHEMA_SOURCE_DIR: ${{ steps.schema-source.outputs.source-dir }}/schemas
        run: npm run stage:schemas

      - name: Verify publication payload
        run: npm run verify

      - name: Assemble gh-pages publication payload
        run: |
          rm -rf "${HAGITASK_GH_PAGES_PAYLOAD_DIR}"
          mkdir -p "${HAGITASK_GH_PAGES_PAYLOAD_DIR}/dist"
          cp .github/gh-pages/esa.jsonc "${HAGITASK_GH_PAGES_PAYLOAD_DIR}/esa.jsonc"
          cp .github/gh-pages/wrangler.jsonc "${HAGITASK_GH_PAGES_PAYLOAD_DIR}/wrangler.jsonc"
          cp -R dist/. "${HAGITASK_GH_PAGES_PAYLOAD_DIR}/dist/"

      - name: Upload validated gh-pages payload
        uses: actions/upload-artifact@v4
        with:
          name: hagitask-site-gh-pages-payload
          path: ${{ env.HAGITASK_GH_PAGES_PAYLOAD_DIR }}
          if-no-files-found: error

  deploy:
    name: Publish validated snapshot to gh-pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    environment:
      name: hagitask-production
      url: https://tasks.hagicode.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download validated gh-pages payload
        uses: actions/download-artifact@v4
        with:
          name: hagitask-site-gh-pages-payload
          path: .deploy/gh-pages

      - name: Publish validated gh-pages payload
        id: publish-gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./.deploy/gh-pages
          force_orphan: true
          enable_jekyll: false

      - name: Summarize deployment output
        if: always()
        env:
          PUBLISH_OUTCOME: ${{ steps.publish-gh-pages.outcome }}
        run: |
          echo "## Publication status" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publication source: validated build artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`gh-pages\` publication: ${PUBLISH_OUTCOME}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Published payload: branch-root \`esa.jsonc\`, \`wrangler.jsonc\`, plus \`dist/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub environment: hagitask-production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Expected public URL: https://tasks.hagicode.com" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            echo "Published the validated gh-pages payload with ./esa.jsonc, ./wrangler.jsonc, and ./dist/."
          else
            echo "Validated gh-pages publication did not complete successfully."
          fi